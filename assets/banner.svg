<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 48px; fill: url(#titleGrad); }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 20px; fill: #cbd5e1; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #f8fafc; }
      
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.05); }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      
      .floating-node { animation: floatSlow 6s ease-in-out infinite; }
      .pulse-bg { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
      .connecting-line { stroke-dasharray: 8 8; animation: dashMove 20s linear infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Animated Glowing Background Orbs (Behind content) -->
  <circle cx="200" cy="100" r="140" fill="url(#glowGrad)" class="pulse-bg" />
  <circle cx="1000" cy="260" r="160" fill="url(#glowGrad)" class="pulse-bg" style="animation-delay: -2s;" />

  <!-- Background Data Flow Lines (Low Opacity behind text) -->
  <g stroke="#475569" stroke-width="1.5" opacity="0.3">
    <path d="M 100 280 Q 300 320 500 280 T 900 300 T 1100 240" fill="none" class="connecting-line" />
    <path d="M 150 80 Q 400 40 700 90 T 1050 70" fill="none" class="connecting-line" style="animation-duration: 15s;" />
  </g>

  <!-- Decorative Floating Pills / Background Graphic Nodes -->
  <g class="floating-node" opacity="0.4">
    <rect x="880" y="50" width="180" height="42" rx="21" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <text x="910" y="76" class="badge-text" fill="#a5b4fc">⚡ Hybrid Search</text>
  </g>
  <g class="floating-node" opacity="0.4" style="animation-delay: -3s;">
    <rect x="920" y="240" width="160" height="42" rx="21" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <text x="950" y="266" class="badge-text" fill="#f0abfc">🤖 RAG &amp; AI</text>
  </g>

  <!-- Main Foreground Content (Title, Subtitle & Primary Badges) -->
  <g transform="translate(80, 0)">
    <!-- Main Icon Graphic -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="72" height="72" rx="18" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#glow)" />
      <!-- Search Glass + AI Spark Icon -->
      <path d="M26 40 A 12 12 0 1 1 40 26 A 12 12 0 0 1 26 40 Z M35 35 L48 48" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" />
      <path d="M46 20 L48 24 L52 26 L48 28 L46 32 L44 28 L40 26 L44 24 Z" fill="#c084fc" />
    </g>

    <!-- Foreground Title and Subtitle -->
    <text x="96" y="145" class="title">Awesome Enterprise Search Platform 🔍</text>
    <text x="96" y="188" class="subtitle">Curated Landscape of Workplace Search, AI/RAG Discovery &amp; Search Engines</text>

    <!-- Category Badges -->
    <g transform="translate(96, 220)">
      <!-- Badge 1: SaaS & Hosted -->
      <rect x="0" y="0" width="140" height="34" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="14" y="22" class="badge-text" fill="#7dd3fc">☁️ SaaS &amp; Hosted</text>

      <!-- Badge 2: Open-Source -->
      <rect x="152" y="0" width="150" height="34" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="1.5" />
      <text x="166" y="22" class="badge-text" fill="#86efac">⚡ Open-Source</text>

      <!-- Badge 3: AI & RAG -->
      <rect x="314" y="0" width="160" height="34" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
      <text x="328" y="22" class="badge-text" fill="#f0abfc">🧠 AI / RAG Native</text>

      <!-- Badge 4: Security & Connectors -->
      <rect x="486" y="0" width="180" height="34" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
      <text x="500" y="22" class="badge-text" fill="#fde047">🔒 Permission-Aware</text>
    </g>
  </g>
</svg>
